# fly.toml app configuration file generated for sinsa-go on 2026-11-04T09:05:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sinsa-go'
primary_region = 'nrt'
kill_timeout = 30

[build]

[env]
  PORT = '8080'
  HOST = '0.0.0.0'
  STORAGE_BACKEND = 'supabase'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  processes = ['app']

[[http_service.checks]]
  grace_period = '90s'
  interval = '30s'
  timeout = '5s'
  method = 'GET'
  path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
