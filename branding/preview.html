<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400&display=swap" />
    <title>共有画像の準備 · こもれび神社</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f4f1e9; }
      .card { display: grid; grid-template-columns: 354px 846px; width: 1200px; height: 630px; }
      .identity { padding: 58px 44px 45px 50px; color: #303730; position: relative; }
      .mark { width: 44px; height: 44px; display: block; }
      .category { font: 12px 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif; letter-spacing: .16em; color: #884738; margin: 31px 0 0; }
      h1 { font: 600 55px/1.5 'Noto Serif JP', 'Hiragino Mincho ProN', serif; letter-spacing: .085em; margin: 18px 0 26px; }
      .description { font: 400 15px/2.15 'Noto Serif JP', 'Hiragino Mincho ProN', serif; letter-spacing: .035em; margin: 0; color: #565d51; }
      .offerings { position: absolute; left: 50px; bottom: 52px; margin: 0; padding-top: 17px; border-top: 1px solid #cfc9bc; font: 11px 'Noto Sans JP', sans-serif; letter-spacing: .06em; color: #63695e; }
      .scene { position: relative; width: 846px; height: 630px; overflow: hidden; border-left: 1px solid #30373012; background: #cbd3bf; }
      canvas { display: block; width: 100%; height: 100%; }
      .state { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; font: 14px sans-serif; background: #f4f1e9; }
      .state[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main class="card" aria-label="こもれび神社の共有用画像">
      <section class="identity">
        <img class="mark" src="/favicon.svg?v=2" alt="" />
        <p class="category">オンライン参拝</p>
        <h1>こもれび<br />神社</h1>
        <p class="description">森の中の、小さな神社。<br />ブラウザーから参拝できます。</p>
        <p class="offerings">手水　参拝　おみくじ　絵馬</p>
      </section>
      <section class="scene" aria-label="実際のゲームの境内">
        <div class="state" role="status">境内を準備しています。</div>
      </section>
    </main>
    <script type="module" src="/branding/scene.ts"></script>
  </body>
</html>
